<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nr-global.com</title>
  <link rel="icon" type="image/svg+xml" href="assets/geltro.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="auth-container">
    <div class="brand">
      <img src="assets/geltro.svg" alt="nr-global" class="logo" />
      <h1>nr-global</h1>
    </div>
    <div class="tabs">
      <button id="tabLogin" class="tab active">Login</button>
      <button id="tabSignup" class="tab">Signup</button>
    </div>
    <div id="loginForm" class="form visible">
      <input id="loginEmail" type="email" placeholder="Email" />
      <input id="loginPassword" type="password" placeholder="Password" />
      <button id="loginBtn">Login</button>
      <a id="forgotLink" class="link" href="#">Forgot password?</a>
      <div id="loginError" class="error"></div>
    </div>
    <div id="signupForm" class="form">
      <input id="signupName" type="text" placeholder="User name" />
      <input id="signupEmail" type="email" placeholder="Email" />
      <input id="signupPassword" type="password" placeholder="Password" />
      <input id="signupConfirm" type="password" placeholder="Retype password" />
      <input id="signupPhone" type="tel" placeholder="Phone number" />
      <input id="signupReferral" type="text" placeholder="Referral number (optional)" />
      <button id="signupBtn">Signup</button>
      <div id="signupError" class="error"></div>
    </div>
  </div>
  <div class="footer">
    <div class="muted">© 2025 nr-global.com</div>
    <div class="icons">

      </a>
      <a class="icon" href="#" aria-label="Facebook">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#1d4ed8"><path d="M22 12a10 10 0 1 0-11.5 9.95v-7.04H8v-2.91h2.5V9.5c0-2.46 1.46-3.82 3.7-3.82 1.07 0 2.19.19 2.19.19v2.4h-1.24c-1.22 0-1.6.76-1.6 1.54v1.85H16.4l-.4 2.91h-2.25v7.04A10 10 0 0 0 22 12"/></svg>
      </a>
      <a class="icon" href="#" aria-label="Instagram">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#1d4ed8"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm5 5a5 5 0 1 0 .001 10.001A5 5 0 0 0 12 7zm6.5-.75a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5z"/></svg>
      </a>
      <a class="icon" href="#" aria-label="Whatsapp">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#1d4ed8"><path d="M19.11 17.205c-.372 0-1.088 1.39-1.518 1.39a.63.63 0 0 1-.315-.1c-.802-.402-1.504-.817-2.163-1.447-.545-.516-1.146-1.29-1.46-1.963a.426.426 0 0 1-.073-.215c0-.33.99-.945.99-1.49 0-.143-.73-2.09-.832-2.335-.143-.372-.214-.487-.6-.487-.187 0-.36-.043-.53-.043-.302 0-.53.115-.746.315-.688.645-1.032 1.318-1.06 2.264v.114c-.015 .99 .472 1.977 1.017 2.78 1.23 1.82 2.506 3.41 4.554 4.34 .616 .287 2.035 .888 2.722 .888 .817 0 2.15-.515 2.478-1.318 .13-.33 .244-

    </div>
  </div>
  <script src="scripts/app.js"></script>
  <script src="scripts/chat.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function(){
      const tabLogin = document.getElementById('tabLogin')
      const tabSignup = document.getElementById('tabSignup')
      const loginForm = document.getElementById('loginForm')
      const signupForm = document.getElementById('signupForm')
      function showLogin(){
        tabLogin.classList.add('active'); tabSignup.classList.remove('active');
        loginForm.classList.add('visible'); signupForm.classList.remove('visible');
      }
      function showSignup(){
        tabSignup.classList.add('active'); tabLogin.classList.remove('active');
        signupForm.classList.add('visible'); loginForm.classList.remove('visible');
      }
      tabLogin.onclick = showLogin
      tabSignup.onclick = showSignup
      ensureAdminUser()
      const loginBtn = document.getElementById('loginBtn')
      const signupBtn = document.getElementById('signupBtn')
      loginBtn.onclick = function(){
        const email = document.getElementById('loginEmail').value.trim()
        const password = document.getElementById('loginPassword').value
        const users = loadUsers()
        const u = users[email]
        if(!u || u.password !== password){
          document.getElementById('loginError').innerText = 'Invalid credentials'
          return
        }
        setCurrentUser(email)
        window.location.href = 'dashboard.html'
      }
      signupBtn.onclick = function(){
        const name = document.getElementById('signupName').value.trim()
        const email = document.getElementById('signupEmail').value.trim()
        const password = document.getElementById('signupPassword').value
        const confirm = document.getElementById('signupConfirm').value
        const phone = document.getElementById('signupPhone').value.trim()
        const referral = document.getElementById('signupReferral').value.trim()
        if(!name || !email || !password || !confirm || !phone){
          document.getElementById('signupError').innerText = 'Name, email, password, confirm and phone required'
          return
        }
        if(password !== confirm){
          document.getElementById('signupError').innerText = 'Passwords do not match'
          return
        }
        const users = loadUsers()
        if(users[email]){ 
          alert('mail is allready registered kindly login')
          document.getElementById('loginEmail').value = email
          showLogin()
          return
        }
        users[email] = {email, username: name, password, phone, invitedByCode: referral || null, inviteRewarded: false, rewardsEarned: 0, balance: 1, depositHistory: [], withdrawalHistory: [], plans: {}, gifted: true, role: 'user', walletAddress: '', walletEditable: true, walletConfirmed: false}
        saveUsers(users)
        notifyAdmins({type:'new_user', message:'New user registered: '+email, data:{email}})
        setCurrentUser(email)
        window.location.href = 'dashboard.html'
      }
      const urlParams = new URLSearchParams(window.location.search)
      const refParam = urlParams.get('ref')
      if(refParam){
        const inputRef = document.getElementById('signupReferral')
        inputRef.value = refParam
      }
      const forgotLink = document.getElementById('forgotLink')
      const resetModal = document.getElementById('resetModal')
      const resetClose = document.getElementById('resetClose')
      const resetBtn = document.getElementById('resetBtn')
      forgotLink.onclick = function(e){ e.preventDefault(); resetModal.style.display='flex' }
      resetClose.onclick = function(){ resetModal.style.display='none' }
      resetBtn.onclick = function(){
        const email = document.getElementById('resetEmail').value.trim()
        const phone = document.getElementById('resetPhone').value.trim()
        const pass = document.getElementById('resetPassword').value
        const conf = document.getElementById('resetConfirm').value
        const msg = document.getElementById('resetMsg')
        if(!email || !phone || !pass || !conf){ msg.innerText='All fields required'; return }
        if(pass !== conf){ msg.innerText='Passwords do not match'; return }
        const users = loadUsers()
        const u = users[email]
        if(!u || (u.phone||'') !== phone){ msg.innerText='Email or phone not found'; return }
        u.password = pass
        users[email] = u
        saveUsers(users)
        msg.innerText='Password updated. Please login.'
      }
    })
  </script>
  <button class="ai-toggle" aria-label="Open AI chat">
    <img src="assets/geltro.svg" alt="AI" />
  </button>
  <div class="ai-panel" id="aiPanel">
    <div class="ai-header"><span class="ai-title">Live Support</span><button class="ai-close" id="aiClose">×</button></div>
    <div class="ai-messages" id="aiMessages"></div>
    <div class="ai-input">
      <input id="aiInput" type="text" placeholder="Type your message..." />
      <input id="aiFile" type="file" accept="image/*" />
      <button id="aiSend">Send</button>
    </div>
  </div>
  <div class="modal" id="resetModal">
    <div class="modal-card">
      <div class="modal-header"><span class="modal-title">Reset Password</span><button class="modal-close" id="resetClose">×</button></div>
      <div class="form visible">
        <input id="resetEmail" type="email" placeholder="Email" />
        <input id="resetPhone" type="tel" placeholder="Phone number" />
        <input id="resetPassword" type="password" placeholder="New password" />
        <input id="resetConfirm" type="password" placeholder="Confirm password" />
        <button id="resetBtn">Reset Password</button>
        <div id="resetMsg" class="error"></div>
      </div>
    </div>
  </div>
</body>
</html>
